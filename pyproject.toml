[project]
name = "fm-analytics"
version = "0.1.0"
description = "Football manager Data Warehouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "celery-progress>=0.5",
    "django>=6.0.5",
    "django-cotton>=2.6.2",
    "django-environ>=0.13.0",
    "django-filter>=25.2",
    "django-htmx>=1.27.0",
    "django-tables2>=3.0.0",
    "django-tailwind[cookiecutter,honcho,reload]>=4.4.2",
    "duckdb>=1.5.2",
    "flower>=2.0.1",
    "ipython>=9.13.0",
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "redis>=7.4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.15.13",
]
