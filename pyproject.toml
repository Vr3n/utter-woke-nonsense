[project]
name = "fm-analytics"
version = "0.1.0"
description = "Football manager Data Warehouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.5",
    "django-cotton>=2.6.2",
    "django-environ>=0.13.0",
    "django-htmx>=1.27.0",
    "django-tailwind[cookiecutter,honcho,reload]>=4.4.2",
    "duckdb>=1.5.2",
    "flower>=2.0.1",
    "psycopg[binary]>=3.3.4",
    "redis>=7.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff>=0.15.13",
]
